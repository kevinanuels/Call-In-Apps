name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project and apply config
        working-directory: app
        run: |
          flutter create --platforms=android --project-name poc_call --org com.example .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/><uses-permission android:name="android.permission.BLUETOOTH"/>\n    <application#' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* 
          grep -n "minSdk" android/app/build.gradle*
          mkdir -p android/app/src/main/kotlin/com/example/poc_call
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/poc_call/MainActivity.kt
          find android/app/src/main -name 'MainActivity*'
          flutter pub get
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=SERVER_URL=${{ vars.SERVER_URL }} \
            --dart-define=TURN_URL=${{ vars.TURN_URL }} \
            --dart-define=TURN_USER=${{ secrets.TURN_USER }} \
            --dart-define=TURN_CRED=${{ secrets.TURN_CRED }}
      - uses: actions/upload-artifact@v4
        with:
          name: poc-call-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
